# tinyproxy.conf - ollama-sandbox-proxy の設定
#
# 許可リスト（/etc/tinyproxy/allowlist）に一致するホストだけを中継し、それ以外は 403 で拒否する。
# 判定はホスト名だけで行う（HTTPS の CONNECT でも同じ）。URL のパスは見ない。

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Connect
# ホスト側のディレクトリ（既定 sandbox/proxy/logs/）に追記する。scripts/proxy.sh がマウントし、
# --userns=keep-id でホストの利用者を tinyproxy ユーザーに対応させるので、ファイルは利用者の所有になる
LogFile "/var/log/tinyproxy/tinyproxy.log"
DisableViaHeader Yes

# 接続元は podman のコンテナ用ネットワークだけ
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# 許可リスト方式: 一致しないホストはすべて拒否する
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# CONNECT（HTTPS のトンネル）は 443 番だけ許す
ConnectPort 443
